# Kafka on Kubernetes with the Strimzi operator (KRaft, no ZooKeeper). Install Strimzi first:
#   helm install strimzi oci://quay.io/strimzi-helm/strimzi-kafka-operator -n sdp
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: sdp
  labels:
    strimzi.io/cluster: telemetry
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: persistent-claim
    size: 50Gi
    deleteClaim: false
  resources:
    requests: {cpu: "500m", memory: 2Gi}
    limits: {memory: 2Gi}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: telemetry
  namespace: sdp
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    listeners:
      - {name: plain, port: 9092, type: internal, tls: false}
      - {name: tls, port: 9093, type: internal, tls: true}
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: device-telemetry
  namespace: sdp
  labels:
    strimzi.io/cluster: telemetry
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "604800000"        # 7 days: the replay window if the lakehouse must be rebuilt
    min.insync.replicas: "2"
    compression.type: zstd

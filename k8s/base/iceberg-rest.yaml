# Iceberg REST catalog in the cluster (on AWS you can use the Glue catalog instead: ICEBERG_CATALOG_TYPE=glue).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
  namespace: sdp
spec:
  replicas: 2
  selector:
    matchLabels: {app: iceberg-rest}
  template:
    metadata:
      labels: {app: iceberg-rest}
    spec:
      serviceAccountName: spark            # same IRSA role: S3 access, no static keys
      containers:
        - name: rest
          image: tabulario/iceberg-rest:1.6.0
          ports: [{containerPort: 8181}]
          env:
            - {name: CATALOG_WAREHOUSE, value: "s3://sdp-lake/warehouse/"}
            - {name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO}
            - {name: AWS_REGION, value: ap-south-1}
            # production: back the catalog with a database instead of the default in-memory SQLite
            - {name: CATALOG_URI, valueFrom: {secretKeyRef: {name: iceberg-catalog-db, key: jdbc-uri}}}
            - {name: CATALOG_JDBC_USER, valueFrom: {secretKeyRef: {name: iceberg-catalog-db, key: user}}}
            - {name: CATALOG_JDBC_PASSWORD, valueFrom: {secretKeyRef: {name: iceberg-catalog-db, key: password}}}
          readinessProbe:
            httpGet: {path: /v1/config, port: 8181}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: sdp
spec:
  selector: {app: iceberg-rest}
  ports: [{port: 8181, targetPort: 8181}]

# Local / CI stack: Kafka (KRaft), SeaweedFS (S3), Iceberg REST catalog, Trino.
# Spark jobs run on the host (pip pyspark) and talk to localhost ports; on Kubernetes they run as SparkApplications.
name: sdp

x-s3-env: &s3env
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
  AWS_REGION: us-east-1

services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  s3:
    # SeaweedFS S3 gateway (MinIO's Docker Hub images are no longer published)
    image: chrislusf/seaweedfs:4.45
    command: server -dir=/data -ip=s3 -ip.bind=0.0.0.0 -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000"]
    volumes: ["./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      retries: 30

  create-bucket:
    image: python:3.12-slim
    depends_on:
      s3: {condition: service_healthy}
    environment: *s3env
    volumes: ["./scripts/create_bucket.py:/create_bucket.py:ro"]
    command: sh -c "pip install -q boto3 && python /create_bucket.py"

  rest:
    image: tabulario/iceberg-rest:1.6.0
    ports: ["8181:8181"]
    depends_on:
      create-bucket: {condition: service_completed_successfully}
    environment:
      <<: *s3env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  trino:
    image: trinodb/trino:460
    ports: ["8080:8080"]
    depends_on: [rest]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    deploy:
      resources:
        limits: {memory: 2g}
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      retries: 60
